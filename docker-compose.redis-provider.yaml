version: "3"

services:
  apisix:
    image: apache/apisix:3.11.0-debian
    restart: always
    volumes:
      - ./apisix_redis_conf.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix:/usr/local/apisix/apisix:ro
      - ./bin:/usr/local/apisix/bin:ro
      - ./utils:/usr/local/apisix/utils:ro
    depends_on:
      - redis
    ports:
      - "9180:9180/tcp"
      - "9080:9080/tcp"
    networks:
      - apisix

  redis:
    image: redis:6.2-alpine
    restart: no
    ports:
      - "6379:6379"
    networks:
      - apisix

  httpbin:
    image: ghcr.io/mccutchen/go-httpbin
    restart: no
    ports:
      - "8280:8080"
    networks:
      - apisix

networks:
  apisix:
    driver: bridge
